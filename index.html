<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заборонені слова</title>
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
  <h2>Перевірка заборонених слів</h2>

  <div class="form-group">
    <label for="text-input">Текст для перевірки:</label>
    <textarea id="text-input" rows="4">This is a test sentence with some bad words.</textarea>
  </div>

  <div class="form-group">
    <label for="words-input">Вкажи заборонені слова (через кому):</label>
    <input type="text" id="words-input" value="bad, test" />
  </div>

  <button id="check-btn">Обробити текст</button>

  <h3>Результат:</h3>
  <div id="result"></div>

  <script type="module" src="./dist/index.js"></script>
</body>
</html>
